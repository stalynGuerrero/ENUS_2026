# Cuerpo reordenado el 2026-08-19 según la estructura §4 del prompt maestro
# v3.0 (4.1 Introducción ... 4.17 Trazabilidad y reproducibilidad).
#
# Los antiguos capítulos "Identidad de la operación estadística" y
# "Versionamiento del instrumento" (sin equivalente en la v3.0) se
# retiraron del libro por instrucción de Stalyn y se archivaron sin
# borrar en `_archivo/capitulos_pre_v3/`.
#
# Se agregaron 4 capítulos nuevos para llenar los huecos de la v3.0 que no
# tenían archivo correspondiente, todos activos por tener contenido
# redactado (no stub): 01-Introduccion.Rmd (§4.1), 04-Marco_conceptual.Rmd
# (§4.5, construido sobre las mismas fuentes ya citadas en Antecedentes:
# Decreto1011_2006, WHO2000Responsiveness, AHRQ_CAHPS),
# 07-Papel_de_las_EPS_e_IPS.Rmd (§5.2 — documenta únicamente lo que
# respaldan ClicSalud y el árbol de decisión: EPS como dato de
# identificación y EPS/IPS/gestor como variable de clasificación del
# módulo; NO describe un mecanismo de reclutamiento institucional porque
# los insumos técnicos no lo evidencian), y 24-Limitaciones.Rmd (§16,
# limitaciones generales de la operación, distintas de las limitaciones
# específicas de cuotas del capítulo 12, que sigue sin redactar).
#
# 02-Antecedentes.Rmd (antes 01-Antecedentes.Rmd) cubre la sección §4.2:
# construido a partir de los antecedentes ya documentados en
# `03_Encuesta/Documento/00_Meotodoogía.qmd` (ciclo MSPS 2003-2023) y
# complementado con investigación web: marco normativo (SOGCS, Decreto
# 1011/2006), la continuidad del ciclo en 2024-2025 (Oficina de Calidad,
# SEA) y referentes internacionales (CAHPS/AHRQ, responsiveness/OMS,
# PaRIS/OCDE). Deliberadamente NO incluye la caracterización de "diseño
# mixto en dos fases" (probabilística + cuotas) de ese mismo insumo para
# ENUS 2026 — esa caracterización sigue en disputa (decisión #2 pendiente,
# ver Anexo de decisiones metodológicas). Referencias en referencias.bib:
# MSPS2024, MSPS2025, DefensoriaPueblo2009, PECASUSS2008, Decreto1011_2006,
# WHO2000Responsiveness, AHRQ_CAHPS, OECD2025PaRIS.
#
# Ver la tabla completa de correspondencia (archivo actual / sección v3.0 /
# archivo anterior) en README.md.

# 26-Referencias.Rmd agregado el 2026-08-19: sección aparte para la
# bibliografía (antes se anexaba sin título al final del último capítulo
# activo). Usa el marcador ::: {#refs} :::, que pandoc reemplaza por la
# lista generada desde referencias.bib. DEBE permanecer como el último
# elemento de `rmd_files` — al activar capítulos adicionales (05 en
# adelante), agregarlos siempre antes de esta línea.

