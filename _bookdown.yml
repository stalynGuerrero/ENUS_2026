# Fuente única: el contenido se redacta directamente en index.Rmd y en los
# capítulos de capitulos_bookdown/*.Rmd (ya no hay Quarto/.qmd de por
# medio). Los capítulos se van llenando uno a uno; cada capítulo permanece
# comentado aquí hasta que su contenido esté listo, momento en el que se
# descomenta para incluirlo en la compilación del libro. Ver README.md.
