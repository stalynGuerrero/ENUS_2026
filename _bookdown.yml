  - index.Rmd
  - capitulos_bookdown/01-Introduccion.Rmd
  - capitulos_bookdown/02-Antecedentes.Rmd
  - capitulos_bookdown/03-Objetivo_y_alcance.Rmd
  - capitulos_bookdown/04-Marco_conceptual.Rmd
  - capitulos_bookdown/05-Poblacion_objetivo_y_marco_de_referencia.Rmd
  - capitulos_bookdown/06-Diseno_muestral.Rmd
  - capitulos_bookdown/07-Papel_de_las_EPS_e_IPS.Rmd
  - capitulos_bookdown/08-Muestreo_por_cuotas.Rmd
  - capitulos_bookdown/09-Variables_de_clasificacion.Rmd
  - capitulos_bookdown/10-Relacion_entre_cuestionario_y_cuotas.Rmd
  - capitulos_bookdown/11-Mecanismo_de_seleccion.Rmd
  - capitulos_bookdown/12-Limitaciones_del_muestreo_por_cuotas.Rmd
  - capitulos_bookdown/13-Instrumento_de_recoleccion.Rmd
  - capitulos_bookdown/14-Flujo_y_rutas_del_cuestionario.Rmd
  - capitulos_bookdown/15-Reconciliacion_de_estructuras.Rmd
  - capitulos_bookdown/17-Procesamiento.Rmd
  - capitulos_bookdown/18-Ponderacion_y_calibracion.Rmd
